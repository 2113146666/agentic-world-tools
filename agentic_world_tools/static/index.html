<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic World Tools</title>
    <style>
      :root {
        --bg: #0b0e11;
        --card: #161c24;
        --line: rgba(120, 160, 140, 0.22);
        --text: #e8eee9;
        --dim: #8f9d93;
        --hud: #7dcca0;
        --warn: #d0b46a;
        --danger: #c45c5c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.55 "IBM Plex Sans", "Segoe UI", "PingFang SC", sans-serif;
        color: var(--text);
        background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61, 155, 106, 0.12), transparent 55%), #0b0e11;
      }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: 0.04em; }
      .sub { color: var(--dim); margin-bottom: 28px; }
      h2 { font-size: 13px; color: var(--hud); letter-spacing: 0.12em; margin: 28px 0 12px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
      th { color: var(--dim); font-weight: 500; }
      tr:last-child td { border-bottom: 0; }
      .ok { color: var(--hud); }
      .bad { color: var(--danger); }
      button {
        background: #3d9b6a;
        color: #07110c;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.ghost { background: transparent; color: var(--hud); border: 1px solid var(--line); }
      pre {
        background: #10151b;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        max-height: 280px;
        overflow: auto;
        font: 12px/1.45 "IBM Plex Mono", ui-monospace, monospace;
        white-space: pre-wrap;
      }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      code { color: var(--hud); word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <h1>Agentic World Tools</h1>
      <p class="sub">本机 <code>:7777</code>。运维工具台，不是知识站。</p>

      <h2>服务状态</h2>
      <table>
        <thead><tr><th>服务</th><th>状态</th></tr></thead>
        <tbody id="services"></tbody>
      </table>

      <h2>服务仓库</h2>
      <table>
        <thead><tr><th>服务</th><th>分支</th><th>commit_id</th><th>路径</th></tr></thead>
        <tbody id="repos"></tbody>
      </table>

      <h2>工具</h2>
      <div class="card">
        <p style="margin-top:0"><strong>一键更新&amp;部署</strong></p>
        <p class="sub" style="margin:0 0 12px">一键拉取所有业务服务的最新代码，并重启commit_id发生变化的服务</p>
        <div class="row">
          <button id="update" type="button">一键更新&amp;部署</button>
          <button class="ghost" id="refresh" type="button">刷新状态</button>
          <span id="jobstate"></span>
        </div>
        <pre id="joblog" style="margin:12px 0 0">还没有执行记录。</pre>
      </div>

      <h2>日志信息</h2>
      <table>
        <thead><tr><th>服务</th><th>日志路径</th></tr></thead>
        <tbody id="logs"></tbody>
      </table>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      async function loadStatus() {
        const res = await fetch("/api/status");
        const data = await res.json();
        $("services").innerHTML = (data.services || [])
          .map((s) => {
            const cls = s.active ? "ok" : "bad";
            const text = s.status || (s.active ? "运行中" : "未启动");
            return `<tr><td>${esc(s.id)}</td><td class="${cls}">${esc(text)}</td></tr>`;
          })
          .join("");
        $("repos").innerHTML = (data.repos || [])
          .map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.exists ? r.branch || "-" : "-")}</td><td><code>${esc(r.exists ? r.commit_id || "-" : "-")}</code></td><td><code>${esc(r.path)}</code></td></tr>`)
          .join("");
        $("logs").innerHTML = (data.logs || [])
          .map((l) => `<tr><td>${esc(l.id)}</td><td><code>${esc(l.log_path)}</code></td></tr>`)
          .join("");
        if (data.job) renderJob(data.job);
      }

      function renderJob(job) {
        $("jobstate").textContent = job.status + (job.ok === false ? " · 失败" : "");
        $("joblog").textContent = (job.lines || []).join("\n") || "（无输出）";
        $("update").disabled = job.status === "running" || job.status === "restarting";
      }

      async function pollJob() {
        try {
          const res = await fetch("/api/jobs/latest");
          if (!res.ok) throw new Error("tools 重启中");
          const data = await res.json();
          if (data.job) renderJob(data.job);
          if (data.job && (data.job.status === "running" || data.job.status === "restarting")) {
            setTimeout(pollJob, 1000);
            return;
          }
        } catch {
          $("jobstate").textContent = "等待 tools 回来…";
          setTimeout(pollJob, 1500);
          return;
        }
        loadStatus();
      }

      $("refresh").onclick = () => loadStatus().catch((e) => ($("joblog").textContent = String(e)));
      $("update").onclick = async () => {
        if (!confirm("确认拉取业务代码？仅重启 commit_id 发生变化的服务。")) return;
        $("update").disabled = true;
        const res = await fetch("/api/tools/update-stack", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          $("joblog").textContent = data.detail || JSON.stringify(data);
          $("update").disabled = false;
          return;
        }
        renderJob(data.job);
        pollJob();
      };

      loadStatus().catch((e) => ($("joblog").textContent = String(e)));
      setInterval(() => loadStatus().catch(() => {}), 8000);
    </script>
  </body>
</html>
